[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softrobot-guidewire"
version = "0.1.0"
description = "Guidewire simulation models for straight and curved vessels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
softrobot = "softrobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
softrobot = [
    "backends/cpp/*",
    "resources/tube_obj/*",
]
