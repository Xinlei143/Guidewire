[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softrobot-guidewire"
version = "0.1.0"
description = "Guidewire simulation models for straight and curved vessels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "torch>=2.0",
    "matplotlib>=3.5",
    "Pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
softrobot = "softrobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
softrobot = [
    "backends/cpp/*",
]

[tool.setuptools.data-files]
"assets/geometry" = [
    "assets/geometry/*.obj",
    "assets/geometry/*.csv",
]
